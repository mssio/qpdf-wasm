name: qpdf update
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: qpdf-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The token is not stored in .git/config: dependency installs and the build run without it.
      # Only the push step below receives it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compare pinned and latest qpdf
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo qpdf/qpdf --json tagName -q .tagName)
          current="v$(bash build/qpdf-version.sh)"
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected qpdf tag: $latest" >&2; exit 1; }
          branch="chore/qpdf-$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number -q 'length')
          if [ "$latest" = "$current" ] || [ "$open_prs" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: pinned $current, latest $latest"
          fi
      - name: Bump submodule
        if: steps.versions.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          git -C vendor/qpdf fetch --depth 1 origin "refs/tags/$LATEST:refs/tags/$LATEST"
          git -C vendor/qpdf checkout "$LATEST"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.versions.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build and verify
        if: steps.versions.outputs.skip != 'true'
        id: verify
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npx playwright install --with-deps chromium firefox webkit
          set +e
          npm run build:wasm > ci.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git add THIRD_PARTY_NOTICES.md README.md   # regenerated for the new version
            bash scripts/ci.sh >> ci.log 2>&1
            status=$?
          fi
          set -e
          git add vendor/qpdf
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 60 ci.log
      - name: Open pull request
        if: steps.versions.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          BRANCH: ${{ steps.versions.outputs.branch }}
          STATUS: ${{ steps.verify.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore: qpdf $LATEST"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          if [ "$STATUS" = "0" ]; then result="✅ \`scripts/ci.sh\` passed"; else result="❌ \`scripts/ci.sh\` failed (exit $STATUS); see the log below and the AGENTS.md upgrade checklist"; fi
          size=$(grep 'qpdf.wasm gzip' ci.log || echo "size: not reached")
          {
            echo "Bumps qpdf $CURRENT → $LATEST."
            echo
            echo "Release notes: https://github.com/qpdf/qpdf/releases/tag/$LATEST"
            echo
            echo "$result"
            echo
            echo "$size"
            echo
            echo "<details><summary>Last 80 lines of ci.sh</summary>"
            echo
            echo '```'
            tail -n 80 ci.log
            echo '```'
            echo "</details>"
            echo
            echo "Before merging: add a CHANGELOG entry (\"Bundles qpdf ${LATEST#v}\"); release as a minor version."
            echo "Note: PRs opened by GITHUB_TOKEN do not trigger ci.yml; the result above is from this workflow."
          } > pr-body.md
          gh pr create --title "chore: qpdf $LATEST" --body-file pr-body.md --base main --head "$BRANCH"

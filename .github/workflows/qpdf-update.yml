name: qpdf update
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Compare pinned and latest qpdf
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo qpdf/qpdf --json tagName -q .tagName)
          current="v$(bash build/qpdf-version.sh)"
          branch="chore/qpdf-$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ] || git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: pinned $current, latest $latest"
          fi
      - name: Bump submodule
        if: steps.versions.outputs.skip != 'true'
        run: |
          git -C vendor/qpdf fetch --depth 1 origin "refs/tags/${{ steps.versions.outputs.latest }}:refs/tags/${{ steps.versions.outputs.latest }}"
          git -C vendor/qpdf checkout "${{ steps.versions.outputs.latest }}"
      - uses: actions/setup-node@v6
        if: steps.versions.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build and verify
        if: steps.versions.outputs.skip != 'true'
        id: verify
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm run build:wasm   # regenerates THIRD_PARTY_NOTICES.md for the new version
          git add vendor/qpdf THIRD_PARTY_NOTICES.md
          set +e
          bash scripts/ci.sh > ci.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 60 ci.log
      - name: Open pull request
        if: steps.versions.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          BRANCH: ${{ steps.versions.outputs.branch }}
          STATUS: ${{ steps.verify.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore: qpdf $LATEST"
          git push origin "$BRANCH"
          if [ "$STATUS" = "0" ]; then result="✅ \`scripts/ci.sh\` passed"; else result="❌ \`scripts/ci.sh\` failed (exit $STATUS); see the log below and the AGENTS.md upgrade checklist"; fi
          size=$(grep 'qpdf.wasm gzip' ci.log || echo "size: not reached")
          {
            echo "Bumps qpdf $CURRENT → $LATEST."
            echo
            echo "Release notes: https://github.com/qpdf/qpdf/releases/tag/$LATEST"
            echo
            echo "$result"
            echo
            echo "$size"
            echo
            echo "<details><summary>Last 80 lines of ci.sh</summary>"
            echo
            echo '```'
            tail -n 80 ci.log
            echo '```'
            echo "</details>"
            echo
            echo "Before merging: add a CHANGELOG entry (\"Bundles qpdf ${LATEST#v}\"); release as a minor version."
            echo "Note: PRs opened by GITHUB_TOKEN do not trigger ci.yml; the result above is from this workflow."
          } > pr-body.md
          gh pr create --title "chore: qpdf $LATEST" --body-file pr-body.md --base main --head "$BRANCH"

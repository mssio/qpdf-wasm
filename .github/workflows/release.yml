name: Release
on:
  push:
    tags: ["v*"]
# Least privilege per job. Only `publish` can mint an OIDC token, and it runs no third-party code:
# it publishes the exact tarball that `build` produced and `test` verified.
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0 # full history + origin/main for the release guard
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # never use caching in release builds
      - name: Tag must match package.json and be on main
        run: bash scripts/check-release-ref.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build:wasm
      - run: bash scripts/check-generated.sh
      - run: npm run build
      - run: npm run lint:package
      - run: npm run check:package
      - run: node scripts/size-report.mjs
      - name: Pack
        run: |
          mkdir -p out/release
          npm pack --ignore-scripts --pack-destination out/release
          ls -l out/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: out/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npx playwright install --with-deps chromium firefox webkit
      # The wasm is rebuilt here only for the unit/Node tests, which run against src/.
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:readme
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out/release
      # Browser tests install the exact tarball that `publish` will upload.
      - name: Browser tests against the release tarball
        run: |
          tarball=$(ls out/release/*.tgz)
          QPDF_TARBALL="$PWD/$tarball" npm run test:browser

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      # No checkout and no dependency install: nothing but npm itself runs with the OIDC token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: release
      - name: Publish
        run: |
          tarball=$(ls release/*.tgz)
          npm publish "./$tarball" --provenance --access public

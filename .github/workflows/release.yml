name: Release
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write # npm trusted publishing (OIDC) + provenance
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: bash scripts/ci.sh
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Only for the very first release (bootstrap token). Once the trusted publisher is
          # configured on npmjs.com, delete the NPM_TOKEN secret and OIDC is used instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node must match the Node 24 runtime (engines >=24); majors are bumped by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      major-updates:
        update-types: [major]

  - package-ecosystem: npm
    directories:
      - /test/browser/fixtures/vite-app
      - /test/browser/fixtures/webpack-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A file: tarball produced by `npm pack` during the browser tests; never on the registry.
      - dependency-name: "@mssio/qpdf-wasm"
    groups:
      browser-fixtures:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
